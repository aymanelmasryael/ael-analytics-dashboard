  <text x="104" y="65" font-family="Inter,sans-serif" font-weight="600" font-size="18" fill="url(#brand)">AEL · ANALYTICS DASHBOARD</text>
  <text x="104" y="82" font-family="'Jetbrains Mono',monospace" font-size="9" fill="#7F8CFF">Pure SVG Charting Engine — Zero External Dependencies</text>
  <rect x="920" y="45" width="220" height="38" rx="20" fill="rgba(0,116,255,0.08)" stroke="rgba(0,116,255,0.15)" stroke-width="1"/>
  <text x="940" y="68" font-family="'Jetbrains Mono',monospace" font-size="11" fill="#0074FF" font-weight="600">5 CHARTS</text>

