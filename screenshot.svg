  <text x="60" y="185" font-family="Inter,sans-serif" font-weight="800" font-size="44" fill="#EFF3FC">Analytics Dashboard</text>
  <text x="60" y="220" font-family="Inter,sans-serif" font-weight="400" font-size="16" fill="#7F8CFF">A pure SVG charting dashboard with line, bar, pie, area, and donut charts — interactive tooltips, KPI metrics, and real-time data simulation</text>

